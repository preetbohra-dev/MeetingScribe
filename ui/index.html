<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeetingScribe</title>
<style>
:root {
  --bg: #f6f6f5; --panel: #ffffff; --ink: #1d1d1f; --soft: #68686e; --line: #e2e2e0; --hover: #efefed;
  --accent: #e5483a; --accent-ink: #ffffff; --warn-bg: #fdf0d8; --warn-ink: #7a5200; --ok: #2d7a4b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17171a; --panel: #212125; --ink: #ececee; --soft: #9d9da5; --line: #34343a; --hover: #2b2b30;
    --warn-bg: #3b2f14; --warn-ink: #f1cf86; --ok: #62c48b;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 "Segoe UI", -apple-system, system-ui, sans-serif; }
h1 { font-size: 22px; margin: 0 0 4px; font-weight: 600; }
h2 { font-size: 15px; margin: 26px 0 10px; font-weight: 600; }
p { margin: 0 0 10px; }
.soft { color: var(--soft); }
.small { font-size: 12.5px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; flex: none; }
button.meeting { white-space: normal; }
.row > button { white-space: nowrap; }
button:hover:not(:disabled) { background: var(--hover); }
button:disabled { opacity: .55; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(.94); }
button.link { background: none; border: 0; padding: 0; color: var(--soft); text-decoration: underline; }
input[type=text], input[type=search], input[type=password], input[type=number], select, textarea { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; width: 100%; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.row { display: flex; gap: 8px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
#app { display: flex; height: 100%; }
nav { width: 200px; flex: none; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 16px 10px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; padding: 0 8px 14px; }
.brand svg { width: 22px; height: 22px; }
nav button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px; }
nav button.on { background: var(--hover); font-weight: 600; }
.status { margin-top: auto; padding: 10px 8px 0; border-top: 1px solid var(--line); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--soft); flex: none; }
.dot.rec { background: var(--accent); }
.dot.ok { background: var(--ok); }
main { flex: 1; min-width: 0; overflow-y: auto; padding: 26px 32px 40px; }
.column { max-width: 780px; margin: 0 auto; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-bottom: 10px; }
.meeting { display: flex; width: 100%; text-align: left; gap: 12px; padding: 11px 14px; align-items: center; margin-bottom: 6px; }
.tag { font-size: 12px; padding: 1px 8px; border-radius: 10px; background: var(--hover); color: var(--soft); white-space: nowrap; }
.tag.need { background: var(--warn-bg); color: var(--warn-ink); }
.tag.live { background: var(--accent); color: var(--accent-ink); }
.warn { background: var(--warn-bg); color: var(--warn-ink); border-radius: 6px; padding: 8px 12px; margin-bottom: 12px; }
ul.plain { margin: 0; padding-left: 18px; }
ul.plain li { margin-bottom: 4px; }
.turn { padding: 5px 0; border-bottom: 1px solid var(--line); }
.turn:last-child { border-bottom: 0; }
.turn b { font-weight: 600; }
.quote { font-style: italic; color: var(--soft); }
.bar { height: 8px; background: var(--hover); border-radius: 4px; overflow: hidden; margin: 12px 0 6px; }
.bar div { height: 100%; background: var(--accent); width: 0; transition: width .4s; }
label.check { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 9px; }
label.check input { margin-top: 4px; }
.field { margin-bottom: 14px; }
.field > label { display: block; font-weight: 600; margin-bottom: 3px; }
#toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 6px; max-width: 70%; display: none; }
.setup { max-width: 560px; margin: 6vh auto; padding: 0 20px; }
pre.terms { white-space: pre-wrap; font: inherit; max-height: 280px; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; padding: 12px; background: var(--panel); }
.fields { display: grid; grid-template-columns: 110px 1fr; gap: 3px 12px; margin: 10px 0; }
.fields .k { color: var(--soft); }
.problem { color: var(--accent); font-size: 12.5px; }
.desc { white-space: pre-wrap; font-size: 13px; color: var(--soft); max-height: 150px; overflow-y: auto; border-left: 2px solid var(--line); padding-left: 10px; margin: 8px 0; }
.card-head { display: flex; gap: 10px; align-items: flex-start; }
.card-head b { flex: 1; min-width: 0; }
.tag.ok { background: var(--ok); color: #fff; }
button.key { background: none; border: 0; padding: 0; color: inherit; text-decoration: underline; font-weight: 600; }
details summary { cursor: pointer; color: var(--soft); margin-bottom: 8px; }
select[multiple] { min-height: 86px; }
@media (prefers-reduced-motion: reduce) { .bar div { transition: none; } }
</style>
</head>
<body>
<div id="app"><div class="setup grow soft">Starting MeetingScribe…</div></div>
<div id="toast" role="status"></div>
<script>
"use strict";
// Everything from a meeting is untrusted text, so the page is built from elements and
// textContent only. Nothing from a transcript ever reaches innerHTML.
const LOGO = '<svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" fill="#e5483a"/><path d="M16 28v8M24 22v20M32 15v34M40 24v16M48 29v6" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none"/></svg>';
const WHY = {screen: "seen on screen", said: "name said aloud", voice: "sounds like them"};
const $app = document.getElementById("app");
let api, view = "meetings", openId = null, statusNow = {}, lastList = "", polling = null;

function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "onclick" || k === "oninput" || k === "onkeydown" || k === "onchange") e[k] = v;
    else if (k === "class") e.className = v;
    else if (k === "disabled" || k === "checked" || k === "value") e[k] = v;
    else if (v !== null && v !== undefined) e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c !== null && c !== undefined && c !== false) e.append(c);
  return e;
}
function toast(text) {
  const t = document.getElementById("toast");
  t.textContent = text; t.style.display = "block";
  clearTimeout(t.timer); t.timer = setTimeout(() => t.style.display = "none", 4500);
}
async function call(name, ...args) {
  try { return await api[name](...args); }
  catch (e) { toast("Something went wrong: " + (e && e.message || e)); throw e; }
}
function when(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleDateString(undefined, {weekday: "short", day: "numeric", month: "short"}) + ", " + d.toLocaleTimeString(undefined, {hour: "2-digit", minute: "2-digit"});
}
function clock(s) {
  s = Math.floor(s);
  const p = n => String(n).padStart(2, "0");
  return (s >= 3600 ? p(Math.floor(s / 3600)) + ":" : "") + p(Math.floor(s / 60) % 60) + ":" + p(s % 60);
}
function rich(text) {  // **bold** only
  return text.split(/\*\*(.+?)\*\*/).map((part, i) => i % 2 ? h("b", null, part) : part);
}
function gb(n) { return (n / 1073741824).toFixed(1) + " GB"; }

// -- first run ---------------------------------------------------------------
async function boot() {
  const s = await call("setup_state");
  if (!s.terms_ok) return showTerms(s);
  if (!s.ai_chosen) return showAiChoice();
  if (!s.models_ok) return showDownload(s);

const FIELD_NAMES = {base_url: "Address (https://…)", region: "Region", project: "Google Cloud project", resource: "Resource name"};
async function showAiChoice(back) {
  clearInterval(polling);
  const st = await call("cloud_state"), hw = await call("setup_state");
  const radio = (on, text) => { const r = h("input", {type: "radio", name: "ai", checked: on, onchange: paint}); return [r, h("label", {class: "check"}, r, h("span", null, text))]; };
  const [local, localL] = radio(!st.cloud, hw.local_ok ? "On this computer. Nothing leaves it, but it needs a large download and a capable computer." : "Transcript only. This computer has " + hw.ram_gb + " GB of memory and a local AI needs 16 GB, so notes get the transcript without a summary.");

  provider.value = st.settings.provider || st.providers[0].id;
  const agree = h("input", {type: "checkbox", onchange: () => paint()});
  const notice = h("span"), note = h("p", {class: "soft small"}), fields = h("div"), panel = h("div"), problem = h("p", {class: "problem"});
  let inputs = {};
  const field = (label, ...kids) => h("div", {class: "field"}, h("label", null, label), ...kids);
  function paint() {
    const p = st.providers.find(x => x.id === provider.value);
    panel.style.display = company.checked ? "" : "none";
    const same = p.id === st.settings.provider;
    if (!Object.keys(inputs).length) {
      inputs = {model: h("input", {type: "text", value: same ? st.settings.model : "", placeholder: p.model || (p.id.endsWith("-cli") ? "The command's default" : "Model name from your company")})};
      for (const f of [...p.fields, ...p.optional]) inputs[f] = h("input", {type: "text", value: same ? st.settings[f] : ""});
      if (p.key) inputs.key = h("input", {type: "password", autocomplete: "off", placeholder: p.saved ? "Saved. Leave empty to keep it." : ""});
      fields.replaceChildren(field("Model", inputs.model), ...[...p.fields, ...p.optional].map(f => field(FIELD_NAMES[f], inputs[f])), p.key ? field("API key", inputs.key) : null);
    }
    note.textContent = p.note; notice.textContent = p.notice + " I agree.";
    go.textContent = company.checked ? "Test and continue" : "Continue";
    go.disabled = company.checked && !agree.checked;
  }
  const go = h("button", {class: "primary", onclick: async () => {
    problem.textContent = "";
    if (!company.checked) { await call("use_local"); return boot(); }
    const values = {provider: provider.value};
    for (const [k, e] of Object.entries(inputs)) if (k !== "key") values[k] = e.value;
    go.disabled = true; go.textContent = "Testing…";
    const r = await call("cloud_save", values, inputs.key ? inputs.key.value : "", agree.checked);
    if (r.ok) return boot();
    problem.textContent = r.message; paint();
  }}, "Continue");
  panel.append(field("Provider", provider), note, fields, h("label", {class: "check"}, agree, notice));
  $app.replaceChildren(h("div", {class: "setup grow"},
    h("h1", null, "Who should write your notes?"),
    h("p", {class: "soft"}, "Recording, transcription and voices always stay on this computer. Only the note writing can use your company's AI."),
    localL, companyL, panel, problem,
    h("div", {class: "row"}, go, back ? h("button", {onclick: showMain}, "Cancel") : null)));
  paint();
}
function showTerms(s) {
  const agree = h("input", {type: "checkbox", onchange: () => go.disabled = !agree.checked});
  const screen = h("input", {type: "checkbox", checked: true});
  const go = h("button", {class: "primary", disabled: true, onclick: async () => {
    await call("accept_terms", screen.checked);
    boot();
  }}, "Continue");
  $app.replaceChildren(h("div", {class: "setup grow"},
    h("h1", null, "Welcome to MeetingScribe"),
    h("p", {class: "soft"}, "It notices your Teams, Zoom and browser meetings, records them, and writes the notes. Nothing is uploaded unless you choose your company's AI on the next page."),
    h("pre", {class: "terms"}, s.terms.replace(/\n +/g, " ")),
    h("label", {class: "check"}, agree, h("span", null, "I have read these terms and I accept them.")),
    h("label", {class: "check"}, screen, h("span", null, "Read people's names from the meeting window, to help work out who said what. Pictures are read for names and thrown away, never saved.")),
    go));
}
function showDownload(s) {
  const bar = h("div"), line = h("p", {class: "soft small"}, "Getting ready…");
  const retry = h("button", {style: "display:none", onclick: start}, "Try again");
  const command = h("pre", {class: "desc"}, "Preparing the command…"), checked = h("p", {class: "problem"});
  const check = h("button", {onclick: async () => {
    check.disabled = true; check.textContent = "Checking the files…"; checked.textContent = "";
    try {
      const r = await call("models_check");
      if (r.ok) { clearInterval(polling); return finish(); }
      checked.textContent = r.message;
    } finally { check.disabled = false; check.textContent = "Check again"; }
  }}, "Check again");
  const copy = h("button", {onclick: async () => {
    try { await navigator.clipboard.writeText(command.textContent); toast("Copied."); }
    catch { toast("Select the command and copy it."); }
  }}, "Copy");
  const manual = h("details", {style: "margin-top:18px"}, h("summary", {class: "small"}, "Download the models yourself with a command"),
    h("p", {class: "soft small"}, s && s.platform === "win32" ? "Open PowerShell, paste this, and press Enter." : "Open Terminal, paste this, and press Enter.", " It needs nothing but this computer's own tools, and you can run it again if it stops. When it finishes, press Check again."),
    command, h("div", {class: "row", style: "gap:10px"}, copy, check), checked);
  call("models_script").then(r => { command.textContent = r.command || r.message; });
  const finish = async () => { await call("finish_setup"); showMain(); };
  async function start() {
    retry.style.display = "none"; line.textContent = "Starting the download…";
    await call("start_download");
    clearInterval(polling);
    polling = setInterval(async () => {
      const p = await call("download_progress");
      if (p.done) { clearInterval(polling); return finish(); }
      if (p.failed) { clearInterval(polling); line.textContent = "The download stopped: " + p.error + " Try again and it picks up where it left off."; retry.style.display = ""; manual.open = true; return; }
      if (p.total) { bar.style.width = Math.min(100, 100 * p.got / p.total) + "%"; line.textContent = gb(p.got) + " of " + gb(p.total); }
      else line.textContent = gb(p.got) + " downloaded";
    }, 1500);
  }
  $app.replaceChildren(h("div", {class: "setup grow"},
    h("h1", null, "Downloading the AI models"),
    h("p", {class: "soft"}, s && s.cloud
      ? "These models turn speech into text on this computer. This happens once, so leave this window open."
      : s && !s.llm_fits ? "This computer has " + s.ram_gb + " GB of memory, too little for a local note-writing AI, so only the speech models are downloaded. Notes will have the transcript without a summary. You can choose your company's AI in Settings."
      : "This happens once and can take a while, so leave this window open. After this, MeetingScribe works without the internet."),
    h("div", {class: "bar"}, bar), line, retry, manual));
  start();
}

// -- main frame --------------------------------------------------------------
function showMain() {
  const items = [["meetings", "Meetings"], ["upcoming", "Upcoming"], ["actions", "Action items"], ["search", "Search and ask"], ["people", "People"], ["connectors", "Connectors"], ["tasks", "Tasks"], ["settings", "Settings"]];
  const navEl = h("nav", null);
  const brand = h("div", {class: "brand"}); brand.innerHTML = LOGO; brand.append("MeetingScribe");
  navEl.append(brand);
  for (const [id, label] of items) navEl.append(h("button", {id: "nav-" + id, onclick: () => go(id)}, label));
  navEl.append(h("div", {class: "status", id: "status"}));
  $app.replaceChildren(navEl, h("main", {id: "main"}));
  go("meetings");
  clearInterval(polling);
  tick(); polling = setInterval(tick, 3000);
}
function go(id, meeting) {
  view = id; openId = meeting || null;
  document.querySelectorAll("nav button[id]").forEach(b => b.classList.toggle("on", b.id === "nav-" + (["jira", "send"].includes(id) ? "connectors" : id)));
  render();
}
async function tick() {
  statusNow = await call("status");
  const st = document.getElementById("status");
  if (!st) return;
  const label = {recording: "Recording " + (statusNow.service || "meeting"), watching: "Watching for meetings", paused: "Paused", off: "Not running"}[statusNow.state];
  const dotClass = statusNow.state === "recording" ? "dot rec" : statusNow.state === "watching" ? "dot ok" : "dot";
  const action = statusNow.state === "off"
    ? h("button", {class: "link small", onclick: async () => { await call("ensure_recorder"); toast("Starting…"); }}, "Start")
    : h("button", {class: "link small", onclick: async () => { await call("set_paused", statusNow.state !== "paused"); tick(); }}, statusNow.state === "paused" ? "Resume" : "Pause");
  st.replaceChildren(h("div", {class: "row"}, h("span", {class: dotClass}), h("span", {class: "grow small"}, label)), action);
  if (statusNow.processing) st.append(h("div", {class: "soft small"}, "Writing notes…"));
  if (view === "meetings" && !openId) refreshList();
  if (view === "jira" && openId) refreshReview();
  if (view === "tasks") refreshTasks();
}

// -- views -------------------------------------------------------------------
function render() {
  const main = document.getElementById("main"); if (!main) return;
  main.scrollTop = 0;
  if (openId && view === "jira") return renderReview(main);
  if (openId && view === "send") return renderSend(main);
  if (openId && view !== "tasks") return renderMeeting(main);
  ({meetings: renderList, search: renderSearch, people: renderPeople, upcoming: renderUpcoming, actions: renderActions, connectors: renderConnectors, jira: renderJira, tasks: renderTasks, settings: renderSettings})[view](main);
}
async function renderList(main) {
  lastList = "";
  main.replaceChildren(h("div", {class: "column"}, h("h1", null, "Meetings"), h("div", {id: "warnings"}), h("div", {id: "list"}, h("p", {class: "soft"}, "Loading…"))));
  refreshList();
}
async function refreshList() {
  const list = await call("meetings"), el = document.getElementById("list");
  const w = document.getElementById("warnings");
  if (w) w.replaceChildren(...recordingNotice(), ...(statusNow.warnings || []).map(t => h("div", {class: "warn"}, t)));
  const stamp = JSON.stringify([list, statusNow.processing]);
  if (!el || stamp === lastList) return;
  lastList = stamp;
  if (!list.length) return el.replaceChildren(h("div", {class: "panel"}, h("p", null, "No meetings yet."), h("p", {class: "soft"}, "Join a call in Teams, Zoom or your browser. Recording starts by itself, and the notes appear here a few minutes after you hang up.")));
  el.replaceChildren(...list.map(m => {
    const busy = m.status === "recording" ? h("span", {class: "tag live"}, "Recording")
      : m.status === "recorded" ? h("span", {class: "tag"}, statusNow.processing === m.id ? "Writing notes…" : "Waiting")
      : m.to_name ? h("span", {class: "tag need"}, m.to_name === 1 ? "1 voice to name" : m.to_name + " voices to name") : null;
    return h("button", {class: "panel meeting", onclick: () => go("meetings", m.id)},
      h("div", {class: "grow"}, h("div", null, m.title), h("div", {class: "soft small"}, [when(m.started_at), m.minutes ? m.minutes + " min" : null, m.source].filter(Boolean).join(" · "))), busy);
  }));
}
function copyButton(text, label) {
  return h("button", {onclick: async () => {
    try { await navigator.clipboard.writeText(text); toast("Copied."); }
    catch { toast("Your computer didn't allow copying."); }
  }}, label);
}
function recordingNotice() {
  if (statusNow.state !== "recording" || !statusNow.notice) return [];
  return [h("div", {class: "panel row wrap"}, h("span", {class: "dot rec"}), h("span", {class: "grow"}, "Recording now. Everyone on the call should know."), copyButton(statusNow.notice, "Copy a notice for the chat"))];
}
async function renderMeeting(main) {
  const m = await call("meeting", openId);
  const back = h("button", {class: "link", onclick: () => go("meetings")}, "‹ Meetings");
  const col = h("div", {class: "column"}, back, h("h1", {style: "margin-top:8px"}, m.meta.title),
    h("p", {class: "soft"}, [when(m.meta.started_at), m.meta.source].filter(Boolean).join(" · ")));
  if (m.meta.status !== "done") {
    col.append(h("div", {class: "panel"}, h("p", null, m.meta.status === "recording" ? "This meeting is being recorded." : "The notes are not finished yet."),
      m.meta.status === "recorded" ? h("button", {onclick: async () => { await call("retry", m.id); toast("Started again."); }}, "Try again") : null));
    return main.replaceChildren(col);
  }
  const unknown = m.voices.filter(v => !v.known), known = m.voices.filter(v => v.known);
  if (unknown.length) {
    col.append(h("h2", null, "Who was this?"));
    unknown.forEach(v => col.append(voiceCard(m, v)));
  }
  col.append(h("h2", null, "Summary"), h("div", {class: "panel"}, m.summary.length ? h("ul", {class: "plain"}, m.summary.map(s => h("li", null, rich(s)))) : h("p", {class: "soft"}, "No summary.")));
  m.sections.forEach(s => col.append(h("h2", null, s.heading), h("div", {class: "panel"}, s.items.length ? h("ul", {class: "plain"}, s.items.map(x => h("li", null, rich(x)))) : h("p", {class: "soft"}, "None."))));
  col.append(h("h2", null, "Action items"), h("div", {class: "panel"}, m.actions.length ? h("ul", {class: "plain"}, m.actions.map(s => { const item = s.replace(/^\[[ x]\]\s*/, ""); return h("li", null, rich(item), " ", h("button", {class: "link small", onclick: () => handToAi(m.id, item.replace(/\*\*/g, ""))}, "Hand to AI")); })) : h("p", {class: "soft"}, "None."),
    h("div", {class: "row wrap", style: "gap:10px;margin-top:10px"},
      m.destinations.length ? h("button", {class: "primary", onclick: () => go("send", m.id)}, "Send recap and follow-ups") : h("button", {onclick: () => go("connectors")}, "Connect Slack, Teams, Gmail or Outlook"),
      m.jira ? h("button", {onclick: () => go("jira", m.id)}, "Review for Jira") : null)));
  if (known.length || m.talk.length) {

    if (m.talk.length) people.append(h("p", null, h("b", null, "Talk time: "), m.talk.map(([n, p]) => n + " " + p + "%").join(", ")));
    known.forEach(v => people.append(h("div", {class: "row"}, h("span", {class: "grow"}, v.label),
      h("button", {class: "link small", onclick: async () => {
        const r = await call("reject_voice", m.id, v.label); toast(r.message); render();
      }}, v.confirmed ? "Undo this name" : "Not this person"))));
    col.append(h("h2", null, "People"), people);
  }

async function renderReview(main) {

async function refreshReview() {
  const sid = openId, r = await call("jira_review", sid);
  const box = document.getElementById("rv-cards"), head = document.getElementById("rv-head");
  if (sid !== openId || view !== "jira" || !box) return;

  const stamp = JSON.stringify([r.state, r.step, r.error, r.done, r.total, r.needs_signin, r.learned_from]);
  if (stamp !== reviewHead) { reviewHead = stamp; renderReviewHead(head, sid, r); }
  const seen = new Set(r.cards.map(c => "c" + c.n));
  [...box.children].forEach(el => { if (!seen.has(el.id)) { el.remove(); delete reviewStamps[el.id]; } });
  r.cards.forEach(c => {
    const id = "c" + c.n, json = JSON.stringify(c);
    let el = document.getElementById(id);
    if (el && (el.dataset.editing || reviewStamps[id] === json)) return;
    reviewStamps[id] = json;
    const fresh = reviewCard(sid, c, r.project);

function renderReviewHead(head, sid, r) {
  const connect = h("button", {onclick: () => go("jira")}, "Connect Jira");
  const again = label => startPanel(head, sid, label);
  if (r.state === "idle") return again("Find tickets in this meeting");
  if (r.state === "working") return head.replaceChildren(h("div", {class: "panel"},
    h("p", null, r.step || "Working…"),
    h("div", {class: "bar"}, h("div", {style: "width:" + (r.total ? 100 * r.done / r.total : 4) + "%"})),
    h("p", {class: "soft small"}, "This uses the local AI, so it can take several minutes. You can approve tickets as they appear."),
    h("button", {onclick: async () => { await call("jira_cancel", sid); refreshReview(); }}, "Stop")));
  if (r.state === "failed") return head.replaceChildren(h("div", {class: "warn"}, r.needs_signin ? "Jira needs you to sign in again." : r.error), r.needs_signin ? connect : startPanel(h("div"), sid, "Try again"));

function keyLink(key) { return h("button", {class: "key", onclick: () => call("jira_open", key)}, key); }

  if (c.related && c.related.length) card.append(h("details", null, h("summary", {class: "small"}, "Found in Jira (" + c.related.length + ")"),
    c.related.map(t => h("div", {class: "small", style: "margin-bottom:3px"}, keyLink(t.key), " ", h("span", {class: "tag"}, t.label), " " + t.summary + (t.status ? " · " + t.status : "")))));

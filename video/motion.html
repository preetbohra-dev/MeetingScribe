<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MeetingScribe demo</title>
<style>
:root { --bg: #17171a; --ink: #ececee; --soft: #9d9da5; --accent: #e5483a; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: "Segoe UI", -apple-system, system-ui, sans-serif; }
.scene { position: absolute; inset: 0; opacity: 0; }
.frame { position: absolute; left: 190px; top: 36px; width: 1540px; height: 866px; overflow: hidden; border-radius: 12px; border: 1px solid #34343a; background: #f6f6f5; }
.frame img { width: 100%; height: 100%; display: block; transform-origin: 62% 30%; }
.kicker { position: absolute; left: 190px; top: 930px; color: var(--accent); font-size: 25px; font-weight: 600; }
.card { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 240px 110px; }
.card svg { width: 112px; height: 112px; margin-bottom: 34px; }
.card h1 { font-size: 104px; font-weight: 600; letter-spacing: -2px; }
.card h2 { font-size: 66px; font-weight: 600; letter-spacing: -1px; margin-bottom: 44px; }
.card p { font-size: 42px; color: var(--soft); margin-top: 18px; line-height: 1.3; }
.card li { font-size: 40px; line-height: 1.3; margin-bottom: 26px; list-style: none; opacity: 0; }
#caption { position: absolute; left: 190px; right: 190px; top: 968px; font-size: 34px; line-height: 1.25; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="caption"></div>
<script src="timeline.js"></script>
<script>
"use strict";
const LOGO = '<svg viewBox="0 0 64 64"><rect width="64" height="64" rx="15" fill="#e5483a"/><path d="M16 28v8M24 22v20M32 15v34M40 24v16M48 29v6" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none"/></svg>';
const SCREENS = {note: "Your notes", templates: "Note templates", actions: "Action items", upcoming: "Pre-meeting briefs", send: "Recap and follow-ups", connectors: "Connectors", assistants: "AI assistants", meetings: "Consent", consent: "Consent and retention"};
const CARDS = {
  title: LOGO + "<h1>MeetingScribe</h1><p>Meeting notes that write themselves, on your Mac or Windows PC.</p>",
  limits: "<h2>What to know first</h2><ul><li>Early software, and the installers are unsigned. Read each note before you act on it.</li><li>Tested on simulated calls. Calendar, Slack and Teams tested against stand-ins.</li><li>Tell people you are recording, and follow the law and your company's policy.</li></ul>",
  outro: LOGO + "<h1>MeetingScribe</h1><p>meetingscribe.preetbohra.com</p>"};
const stage = document.getElementById("stage"), caption = document.getElementById("caption"), scenes = window.TIMELINE.scenes, FADE = 0.3;
const parts = scenes.map(s => {
  const el = document.createElement("div");
  el.className = "scene";
  el.innerHTML = CARDS[s.id] ? '<div class="card">' + CARDS[s.id] + "</div>" : '<div class="frame"><img src="shots/' + s.id + '.png" alt=""></div><div class="kicker">' + SCREENS[s.id] + "</div>";
  stage.append(el);
  return {s, el, img: el.querySelector("img"), items: [...el.querySelectorAll("li")]};
});
window.renderAt = t => {
  let text = "";
  for (const {s, el, img, items} of parts) {
    const local = t - s.start, shown = local >= 0 && local < s.dur;
    el.style.opacity = shown ? Math.min(1, local / FADE, (s.dur - local) / FADE + 0.001) : 0;
    if (!shown) continue;
    if (img) img.style.transform = "scale(" + (1 + 0.035 * local / s.dur) + ")";
    items.forEach((li, i) => { li.style.opacity = s.lines[i] && local >= s.lines[i].t ? 1 : 0; });
    for (const line of s.lines) if (local >= line.t - 0.1) text = line.text;
    caption.style.display = CARDS[s.id] && s.id !== "limits" && local < 0 ? "none" : "";
  }
  if (caption.textContent !== text) caption.textContent = text;
};
window.renderAt(0);
</script>
</body>
</html>

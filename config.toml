# MeetingScribe settings. Every key is optional; defaults live in meeting_scribe.py.
# After editing: ./ctl.sh restart

output_dir = "~/Documents/Meeting Notes"
my_name = "Me"
others_name = "Others"
language = ""                 # "" = detect, even if it changes during a meeting; "en", "hi", ... = only that language, and the rest is lost
keep_audio = false             # stereo WAV (L = Me, R = Others) saved next to each note
notify = true                 # notification on start / stop / notes ready

# Apps watched for calls: "teams", "zoom", "browsers" (Google Meet, Teams, Zoom, Webex ... in
# Chrome, Edge, Firefox, Brave, Arc or Safari), or single browsers: "chrome", "edge", "safari", ...
meeting_apps = ["teams", "zoom", "browsers"]
# "app" = only the meeting app's audio; "all" = all system audio (fallback if app capture is silent)
capture_mode = "app"
# "tap" = Core Audio process tap (no orange screen-recording glow); "screencapturekit" = old path
system_audio_backend = "tap"
mic_device = ""               # part of a mic's name, e.g. "AirPods"; "" = system default

# Detection timing (seconds)
start_after_s = 1
stop_after_s = 10
min_meeting_s = 10

# Models (downloaded once with `download-models`, then used fully offline).
# Left unset, each OS picks its own: Mac = mlx-whisper + mlx Qwen 2.5 14B; Windows =
# faster-whisper + llama.cpp Qwen 2.5 GGUF (14B with 24 GB of RAM or more, else 7B).
# whisper_model = "mlx-community/whisper-large-v3-turbo"   # Windows: "dropbox-dash/faster-whisper-large-v3-turbo"
# llm_backend = "mlx"         # "mlx" (Mac), "llamacpp" (Windows), "ollama" (local server) or "cloud" (see [cloud_llm])
mlx_llm_model = "mlx-community/Qwen2.5-14B-Instruct-4bit"   # summary, action items and work filter
# gguf_model = "bartowski/Qwen2.5-14B-Instruct-GGUF/Qwen2.5-14B-Instruct-Q4_K_M.gguf"
ollama_model = "qwen2.5:14b"
ollama_url = "http://127.0.0.1:11434"   # non-loopback URLs are refused

# Keep only work discussion: small talk and personal conversation are left out of the summary,
# the note's transcript and transcript.json. false = keep every line.
work_only = true
work_filter_model = ""        # "" = same model as mlx_llm_model (loaded once); or another mlx model

# Suspected echo / low-confidence lines are kept and tagged in the note; true = delete them
drop_suspect_lines = false

# What the app offers to paste into the meeting chat while recording
# consent_notice = "Heads up: I'm recording and transcribing this call on my computer for my own notes."
never_record = []              # a meeting whose title contains any of these is not recorded, e.g. ["HR", "doctor"]
retain_days = 0                # delete whole meetings older than this many days; 0 = keep them
retain_audio_days = 0          # delete only the audio of meetings older than this; 0 = keep it
mcp_enabled = false            # let AI assistants on this computer read your meetings: `mcp` command

# Company AI (optional): choose it in the app's Settings, or with `./ctl.sh ai --set <provider>`.
# Transcript text goes to that provider; audio, voices and screen pictures stay here. API keys are kept
# in your keychain, not this file, and nothing is sent until you have agreed to the provider.
# Providers: anthropic, bedrock, vertex, foundry, gemini, gemini-vertex, openai, claude-cli, gemini-cli, copilot-cli
[cloud_llm]
provider = ""
model = ""                    # "" = the provider's default, where it has one
base_url = ""                 # https:// address of an OpenAI-compatible gateway ("openai")
region = ""                   # "bedrock", "vertex", "gemini-vertex"
project = ""                  # Google Cloud project: "vertex", "gemini-vertex", "gemini-cli"
resource = ""                 # "foundry"
ssl_strict = false            # false = accept Zscaler-style proxy CAs (chain and hostname still checked)
ca_bundle = ""                # corporate root CA .pem, if HTTPS fails with a certificate error

# Jira (optional): `./ctl.sh jira` drafts tickets from a meeting and asks you before every push.
# Credentials never go in this file: you paste a token or browser session cookie when asked, and
# it is kept in your macOS Keychain or Windows Credential Manager ("MeetingScribe Jira"). base_url must start with https://.
[jira]
base_url = ""                 # e.g. "https://yourcompany.atlassian.net"; "" = asked on first run
deployment = "cloud"          # "cloud" (*.atlassian.net) or "server" (Server / Data Center)
auth = ""                     # "bearer" (personal access token), "basic" (email + API token), "cookie"; "" = ask
email = ""                    # only for auth = "basic"
project = ""                  # suggested space for new tickets; you confirm it every run
search_days = 365             # related-ticket search covers tickets updated this recently, in every space
labels = ["meetingscribe"]    # added to every ticket created
ssl_strict = false            # false = accept Zscaler-style proxy CAs (chain and hostname still checked)
ca_bundle = ""                # corporate root CA .pem, if HTTPS fails with a certificate error
